# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# node-exporter, kube-state-metrics (cluster health).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.0.0
    helm:
      releaseName: kps      # -> kps-grafana, kps-prometheus services
      valuesObject:
        fullnameOverride: kps
        prometheus:
          prometheusSpec:
            # pick up ServiceMonitors from every namespace, not only this release's
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 7d
            scrapeInterval: 15s
            resources:
              requests: {cpu: 200m, memory: 1Gi}
        grafana:
          adminPassword: shopsphere-admin   # demo only - change for anything real
          defaultDashboardsEnabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
        # GKE manages the control plane; these targets are not scrapeable
        kubeControllerManager: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeEtcd: {enabled: false}
        kubeProxy: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # CRDs are too large for client-side apply annotations
